name: 'Buildalon Unity Setup'
description: A GitHub action for setting up the Unity Game Engine for CI/CD workflows.
branding:
  color: 'red'
  icon: download
inputs:
  version-file:
    description: 'Specify a path to search for the unity project version text file. Useful if there are multiple projects in a single repo. Pass `None` if creating a new project to skip file search.'
    required: false
    default: ''
  unity-version:
    description: 'Specify the Unity version(s) to install. example: `2019.4.13f1 (518737b1de84)`. ***This will override any version specified in the `version-file`!***'
    required: false
    default: ''
  build-targets:
    description: 'Specify the build targets to install modules for. One or more of `StandaloneWindows64` `WSAPlayer` `StandaloneOSX` `iOS` `StandaloneLinux64` `Android` `Lumin` `WebGL` `VisionOS`.'
    required: false
    default: ''
  modules:
    description: 'Modules to install with the editor. This list can be different per editor version.'
    required: false
    default: ''
  architecture:
    description: 'Specify the architecture to install. Either `x86_64` or `arm64`.'
    required: false
    default: ''
  install-path:
    description: 'Specify the path where Unity will be installed to.'
    required: false
  unity-cli-version:
    description: 'The version of the official Unity CLI to install, such as `1.0.0-beta.14`, or `latest`. Defaults to `UNITY_CLI_VERSION` when an earlier step set it, otherwise `latest`.'
    required: false
    default: ''
  channels:
    description: 'The release channels to accept when resolving a partial `unity-version`, as comma-separated letters: `f` (stable), `p` (patch), `b` (beta), `a` (alpha), `x` (experimental). A stable release still wins once a stream has one.'
    required: false
    default: 'f'
  allow-security-alert:
    description: 'Install editors that carry a Unity Security Alert, with a warning instead of an error. Can be `true` or `false`.'
    required: false
    default: 'false'
  cache-installation:
    description: 'Cache the Unity installation between workflow runs to speed up subsequent runs. Can be `true` or `false`.'
    required: false
    default: 'false'
outputs:
  unity-cli-path:
    description: 'The file path to the official Unity CLI executable.'
  unity-cli-version:
    description: 'The installed official Unity CLI version.'
  unity-editors:
    description: 'A JSON array of all installed Unity Editors on the runner.'
  unity-editor-path:
    description: 'The path to the latest installed version of Unity.'
  unity-project-path:
    description: 'The file path to the Unity project.'
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
